---
layout: default
---
<article class="brief">
  <header class="brief-header">
    <span class="topic-tag topic-{{ page.topic | downcase }}">{{ page.topic }}</span>
    <h1>{{ page.title }}</h1>
    <p class="brief-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="brief-content">
    {{ content }}
  </div>

  <footer class="brief-footer">
    <a href="{{ '/briefs/' | relative_url }}">&larr; Back to all briefs</a>
  </footer>
</article>
