---
layout: default
---
<article class="actor-page">
  <header class="actor-hero">
    <span class="actor-avatar-lg">{{ page.title | slice: 0, 2 | upcase }}</span>
    <div class="actor-hero-text">
      <span class="tag tag-neutral">{{ page.institution }}</span>
      <h1>{{ page.title }}</h1>
    </div>
  </header>

  <div class="info-grid">
    {% if page.role %}
    <div class="info-card">
      <div class="info-label">Role</div>
      <div class="info-value">{{ page.role }}</div>
    </div>
    {% endif %}
    {% if page.position %}
    <div class="info-card">
      <div class="info-label">Political position</div>
      <div class="info-value">{{ page.position }}</div>
    </div>
    {% endif %}
  </div>

  <div class="directive-content">
    {{ content }}
  </div>

  <footer class="brief-footer">
    <a href="{{ '/actors/' | relative_url }}">&larr; Back to all actors</a>
  </footer>
</article>
