---
layout: default
---
<article class="alert-page">
  <header>
    <span class="tag tag-alert">Alert</span>
    {% if page.directive %}<span class="tag tag-institutional">{{ page.directive }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    <p style="color: var(--muted); font-size: 0.85rem;">{{ page.date | date: "%d %B %Y" }}</p>
  </header>
  <div class="directive-content">
    {{ content }}
  </div>
  <footer class="brief-footer">
    <a href="{{ '/alerts/' | relative_url }}">&larr; Back to all alerts</a>
  </footer>
</article>
